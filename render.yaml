services:
  - type: web
    name: cogniviz-billing-system
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install && npm run build && cd ..
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@cogniviz.com
      - key: ADMIN_PASSWORD
        value: Admin@Cogniviz2026
      - key: ADMIN_NAME
        value: Cogniviz Administrator
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: TURSO_DATABASE_URL
        value: "libsql://cogniviz-technologies-billing-system-sudhanshubhoyar18.aws-ap-south-1.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false

